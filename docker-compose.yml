services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airport360
      POSTGRES_PASSWORD: airport360
      POSTGRES_DB: airport360
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport360"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://airport360:airport360@postgres:5432/airport360
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
