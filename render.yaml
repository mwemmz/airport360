# Render Blueprint — Airport360 (backend + frontend), Turso as the database.
#
# Backend:    Render Web Service (Linux) — installs requirements.txt + requirements-turso.txt,
#             runs Uvicorn. Tables are created and demo data seeded automatically at
#             startup (seeding runs in a background thread), so the service boots fast
#             and recovers from transient Turso outages without crashing.
# Frontend:   Render Static Site — builds with VITE_API_URL pointing at the backend.
#
# After creating your Turso database, set these secrets/env vars on the backend service:
#   TURSO_DATABASE_URL  bare Turso URL, e.g. libsql://<your-db>-<org>.turso.io
#                       (the code accepts sqlite+libsql://<...>?secure=true or the old
#                       DATABASE_URL name as a fallback too)
#   TURSO_AUTH_TOKEN    the Turso db token (never commit it)
#   SECRET_KEY          a long random value
services:
  - type: web
    name: airport360-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r requirements-turso.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
        comment: "Must stay <=3.13: libsql-experimental (Turso driver) has no cp314 wheels"
      - key: TURSO_DATABASE_URL
        sync: false
        comment: "Bare Turso URL, e.g. libsql://<db>-<org>.turso.io (no sqlite+ prefix, no query params)"
      - key: TURSO_AUTH_TOKEN
        sync: false
        comment: "Turso database auth token (secret)"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://airport360-frontend.onrender.com"]'
        comment: "JSON array of allowed origins — must be valid JSON (quoted URLs)"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"

  - type: web
    name: airport360-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /<.*>
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://airport360-api.onrender.com
        comment: "Backend base URL (no /v1 suffix). Set at build time."
